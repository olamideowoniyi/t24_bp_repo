name: T24 BP - Compile and Deploy

on:
  push:
    branches:
      - dev
      - uat
      - prod
    paths:
      - 'bp/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'dev'
        type: choice
        options: [dev, uat, prod]

jobs:
  compile-and-deploy:
    runs-on: self-hosted

    env:
      ENV: ${{ github.event.inputs.environment || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, needed to work out what changed

      - name: Compile (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call pipeline\compile.bat

      - name: Deploy (Windows)
        if: runner.os == 'Windows'
        shell: cmd
        run: call pipeline\deploy.bat

      - name: Compile (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          chmod +x pipeline/compile.sh pipeline/deploy.sh
          pipeline/compile.sh

      - name: Deploy (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: pipeline/deploy.sh
